<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>THE ESSENCE</title> 
</head>
<body>
    <h1>-- MUSIC IS THE ESSENCE --</h1>

    <div class="music-container">
        <div class="music-info">
            <h4 id="title">Moths</h4>
            <div class="progress-container">
                <div class="progress"></div>
            </div>
        </div>

        <audio src="music/Moths.mp3" id="audio"></audio>

        <div class="img-container">
            <img src="covers/Moths.jpg" alt="music-cover" width="100" height="100" id="cover"/>
        </div>

        <div class="navigation">
            <button id="prev" class="action-btn action-btn">
                <i class="fas fa-backward"></i>
            </button>
            <button id="play" class="action-btn-big">
                <i class="fas fa-play"></i>
            </button>
            <button id="next" class="action-btn">
                <i class="fas fa-forward"></i>
            </button>
        </div>

    </div>



    <script src="script.js"></script>
</body>
</html>
